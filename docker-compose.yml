services:
  # 1. Cơ sở dữ liệu MySQL
  db:
    image: mysql:8.0
    container_name: booking-clinic-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: booking_clinic_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db_init/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - clinic-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Redis Caching
  redis:
    image: redis:alpine
    container_name: booking-clinic-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - clinic-network

  # 3. Spring Boot Backend
  backend:
    build:
      context: ./Backend_API/booking-clinic
      dockerfile: Dockerfile
    container_name: booking-clinic-backend
    restart: always
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/booking_clinic_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ho_Chi_Minh
    networks:
      - clinic-network

  # 4. React JS Frontend
  frontend:
    build:
      context: ./Frontend_ReactJs
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api/v1
    container_name: booking-clinic-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - clinic-network

volumes:
  mysql_data:

networks:
  clinic-network:
    driver: bridge
