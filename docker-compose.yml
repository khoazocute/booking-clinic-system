services:
  # 1. Cơ sở dữ liệu MySQL
  db:
    image: mysql:8.0
    container_name: booking-clinic-db
    restart: always
    environment:
      # the default only suits a local machine; production must set MYSQL_ROOT_PASSWORD before the first start
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: booking_clinic_db
    ports:
      - "127.0.0.1:3306:3306"   # loopback only: never reachable from the internet
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db_init/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - clinic-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Redis Caching
  redis:
    image: redis:alpine
    container_name: booking-clinic-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"   # loopback only
    networks:
      - clinic-network

  # 3. Spring Boot Backend
  backend:
    build:
      context: ./Backend_API/booking-clinic
      dockerfile: Dockerfile
    container_name: booking-clinic-backend
    restart: always
    ports:
      - "127.0.0.1:8082:8082"   # the browser goes through the frontend's nginx (/api, /ws)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/booking_clinic_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ho_Chi_Minh
      # security: required, no defaults (see .env.example)
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # VNPay: secret stays on the server
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:5173/payment/return}
      # links in reminder emails; SMTP is optional (without it reminders are in-app only)
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # AI_Service gateway (falls back to the local keyword router when unreachable)
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?set AI_INTERNAL_TOKEN in .env}
      # LLM cost guards: per minute, per patient per day, whole system per day (then free fallback)
      AI_CHAT_RATE_LIMIT_PER_MINUTE: ${AI_CHAT_RATE_LIMIT_PER_MINUTE:-10}
      AI_CHAT_DAILY_LIMIT_PER_USER: ${AI_CHAT_DAILY_LIMIT_PER_USER:-40}
      AI_CHAT_DAILY_LIMIT_GLOBAL: ${AI_CHAT_DAILY_LIMIT_GLOBAL:-500}
    networks:
      - clinic-network

  # 4. Python AI service (internal: only the backend calls it)
  ai-service:
    build:
      context: ./AI_Service
    container_name: booking-clinic-ai
    restart: always
    # no published port: reachable only from the backend on clinic-network
    # (debug with: docker compose exec ai-service python -c "...")
    depends_on:
      vector-db:
        condition: service_healthy
    environment:
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?set AI_INTERNAL_TOKEN in .env}
      BACKEND_BASE_URL: http://backend:8082
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Gemini (free tier) is preferred when its key is set; LLM_PROVIDER=openai forces OpenAI
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.6-flash}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4.1-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_PROVIDER: auto   # OpenAI embeddings if OPENAI_API_KEY is set, BM25 otherwise
      DATABASE_URL: postgresql://kb:${VECTOR_DB_PASSWORD:-kbpassword}@vector-db:5432/knowledge
      TZ: Asia/Ho_Chi_Minh
    networks:
      - clinic-network

  # 5. pgvector: RAG knowledge base (derived data, can always be rebuilt from MySQL + knowledge/faq.md)
  vector-db:
    image: pgvector/pgvector:pg17
    container_name: booking-clinic-vector-db
    restart: always
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: ${VECTOR_DB_PASSWORD:-kbpassword}
      POSTGRES_DB: knowledge
    volumes:
      - vector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d knowledge"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - clinic-network

  # 6. React JS Frontend
  frontend:
    build:
      context: ./Frontend_ReactJs
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api/v1
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-697419537092-hlpku562p2k4jksomi6na2lg1t37qjj2.apps.googleusercontent.com}
    container_name: booking-clinic-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - clinic-network

volumes:
  mysql_data:
  vector_data:

networks:
  clinic-network:
    driver: bridge
