name: Deploy Booking Clinic System

on:
  push:
    branches:
      - main
      - master
      - Khoavo # Tự động deploy khi push code lên nhánh main, master hoặc Khoavo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # 1. Di chuyển vào thư mục dự án trên VPS (đường dẫn mặc định trong thư mục home)
            cd ~/booking-clinic-system || exit 1
            
            # 2. Cập nhật mã nguồn mới nhất từ GitHub
            git pull
            
            # 3. Chạy lệnh build và khởi động lại hệ thống bằng Docker Compose
            docker-compose up -d --build
