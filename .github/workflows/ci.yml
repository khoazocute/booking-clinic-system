name: CI

on:
  push:
  pull_request:

# a newer push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai-service:
    name: AI service (pytest + offline evals)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI_Service
        shell: bash
    services:
      # real pgvector so the vector-store round-trip test runs instead of being skipped
      pgvector:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb
          POSTGRES_DB: knowledge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kb -d knowledge"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGVECTOR_TEST_URL: postgresql://kb:kb@localhost:5432/knowledge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: AI_Service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit and API tests (fake models, no OpenAI calls)
        run: python -m pytest -q
      - name: Offline evaluation (BM25 / keyword only, free)
        run: |
          python -m eval.run_eval --router all-offline
          python -m eval.retrieval_eval --retriever bm25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: AI_Service/eval/reports/
          if-no-files-found: ignore

  backend:
    name: Backend (JUnit + MySQL concurrency test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend_API/booking-clinic
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Docker is available on GitHub runners, so the Testcontainers MySQL test runs here
      - name: Tests
        run: ./mvnw -B -ntp test | tee test.log
      - name: Double-booking result
        if: always()
        run: |
          {
            echo "### Concurrent bookings of one slot"
            echo '```'
            grep -h "concurrent bookings" test.log || echo "(not found)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend_ReactJs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend_ReactJs/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    name: docker-compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate (dummy secrets; real ones live only in .env)
        env:
          JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef
          AI_INTERNAL_TOKEN: ci-only-not-a-real-token
        run: docker compose config -q
