server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Định tuyến tất cả request về index.html để React Router xử lý định tuyến (tránh lỗi 404 khi F5)
        try_files $uri $uri/ /index.html;
    }

    # index.html trỏ tới file JS/CSS có hash: không được cache, để mỗi lần deploy trình duyệt lấy bản mới
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # File trong /assets có hash trong tên, nội dung đổi thì tên đổi: cache lâu dài an toàn
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Server-sent events (trợ lý AI trả lời dạng stream): không buffer, giữ kết nối lâu hơn
    location /api/v1/ai/chat/stream {
        proxy_pass http://backend:8082;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # Cấu hình proxy ngược cho các request API
    location /api/ {
        proxy_pass http://backend:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cấu hình proxy ngược cho WebSocket
    location /ws {
        proxy_pass http://backend:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
